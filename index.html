<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resignation &amp; Offboarding Workflow — Design Artifact</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        color: #202939;
        background: #f6f7f9;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .obwd-root {
        min-height: 100vh;
        padding-bottom: 76px;
      }

      .obwd-prototype-banner {
        padding: 10px 0;
        background: #eff6ff;
        border-bottom: 1px solid #bfdbfe;
        color: #1e3a8a;
        font-size: 13px;
      }

      .obwd-container {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding-left: 20px;
        padding-right: 20px;
      }

      .obwd-page-header {
        padding: 14px 0;
        border-bottom: 1px solid #e4e7ec;
        background: #fff;
      }

      .obwd-page-header .obwd-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .obwd-page-header h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-page-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .obwd-back-button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        padding: 0;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: #344054;
        cursor: pointer;
      }

      .obwd-page-content {
        padding-top: 16px;
        padding-bottom: 24px;
      }

      .obwd-card {
        margin-bottom: 16px;
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(16 24 40 / 4%);
      }

      .obwd-summary-card {
        border-left: 3px solid #3155a5;
      }

      .obwd-template-card {
        border-left: 3px solid #7c3aed;
      }

      .obwd-card-body {
        padding: 16px;
      }

      .obwd-card-header {
        padding: 12px 16px;
        border-bottom: 1px solid #e4e7ec;
      }

      .obwd-card-header h2 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-card-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-card-header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .obwd-summary-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }

      .obwd-eyebrow {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 700;
        color: #3155a5;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .obwd-eyebrow-purple {
        color: #6d28d9;
      }

      .obwd-summary-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-summary-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #101828;
      }

      .obwd-muted {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-progress-wrap {
        width: min(320px, 100%);
      }

      .obwd-progress-wrap > span {
        display: block;
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 600;
        color: #475467;
        text-align: right;
      }

      .obwd-progress-bar {
        height: 6px;
        overflow: hidden;
        border-radius: 4px;
        background: #eaecf0;
      }

      .obwd-progress-bar > span {
        display: block;
        height: 100%;
        background: #3155a5;
        transition: width 0.2s ease;
      }

      .obwd-alert {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
      }

      .obwd-alert-success {
        border: 1px solid #abefc6;
        background: #ecfdf3;
        color: #067647;
      }

      .obwd-alert-danger {
        border: 1px solid #fecdca;
        background: #fef3f2;
        color: #b42318;
      }

      .obwd-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }

      .obwd-badge-purple {
        background: #7c3aed;
      }

      .obwd-form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }

      .obwd-final-summary {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin: 16px 0;
        padding: 14px;
        border: 1px solid #d9e2f2;
        border-radius: 7px;
        background: #f8faff;
        overflow: visible;
      }

      .obwd-asset-clearance {
        padding-top: 14px;
        border-top: 1px solid #d9e2f2;
        overflow: visible;
      }

      .obwd-asset-clearance h4 {
        margin: 0 0 10px;
        font-size: 13px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-asset-counts {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 10px;
      }

      .obwd-field label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 500;
        color: #344054;
      }

      .obwd-field input,
      .obwd-field select,
      .obwd-field textarea {
        width: 100%;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 5px;
        font-size: 13px;
      }

      .obwd-field input[readonly],
      .obwd-field textarea[readonly] {
        background: #f7f8fa;
        color: #475467;
      }

      .obwd-field textarea {
        min-height: 96px;
        resize: vertical;
      }

      .obwd-details-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
      }

      .obwd-check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #344054;
      }

      .obwd-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-btn {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid transparent;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }

      .obwd-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .obwd-btn-primary {
        border-color: #3155a5;
        background: #3155a5;
        color: #fff;
      }

      .obwd-btn-secondary {
        border-color: #d0d5dd;
        color: #344054;
      }

      .obwd-btn-danger {
        border-color: #fda29b;
        color: #b42318;
        background: #fff;
      }

      .obwd-btn-ghost {
        border-color: transparent;
        color: #475467;
        background: transparent;
      }

      .obwd-flow-stepper {
        display: flex;
        align-items: stretch;
        gap: 0;
        margin-bottom: 16px;
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        overflow: hidden;
        background: #fff;
      }

      .obwd-flow-step {
        flex: 1;
        display: flex;
        align-items: center;
        gap: 10px;
        min-height: 52px;
        padding: 10px 14px;
        border: 0;
        border-right: 1px solid #e4e7ec;
        background: #fbfcfd;
        color: #667085;
        text-align: left;
        cursor: pointer;
      }

      .obwd-flow-step:last-child {
        border-right: 0;
      }

      .obwd-flow-step strong {
        display: block;
        font-size: 12px;
        color: #344054;
      }

      .obwd-flow-step small {
        display: block;
        font-size: 11px;
        color: #667085;
      }

      .obwd-flow-step.is-active {
        background: #eff4ff;
        box-shadow: inset 0 -2px 0 #3155a5;
      }

      .obwd-flow-step.is-complete {
        background: #f6fef9;
      }

      .obwd-flow-step-index {
        display: grid;
        width: 24px;
        height: 24px;
        place-items: center;
        border-radius: 999px;
        background: #eaecf0;
        font-size: 11px;
        font-weight: 700;
        color: #475467;
        flex: 0 0 auto;
      }

      .obwd-flow-step.is-active .obwd-flow-step-index {
        background: #3155a5;
        color: #fff;
      }

      .obwd-flow-stepper.is-readonly .obwd-flow-step {
        cursor: default;
      }

      .obwd-flow-stepper.is-readonly .obwd-flow-step:disabled {
        opacity: 1;
      }

      .obwd-flow-stepper:not(.is-readonly) .obwd-flow-step {
        cursor: pointer;
      }

      .obwd-flow-stepper:not(.is-readonly) .obwd-flow-step:hover {
        background: #f2f4f7;
      }

      .obwd-role-gate {
        max-width: 720px;
        margin: 0 auto;
      }

      .obwd-role-gate h2 {
        margin: 0 0 8px;
        font-size: 16px;
        color: #1d2939;
      }

      .obwd-role-gate p {
        margin: 0 0 12px;
        font-size: 13px;
        color: #667085;
      }

      .obwd-readonly-banner {
        margin-bottom: 16px;
        padding: 10px 14px;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #f9fafb;
        font-size: 13px;
        color: #475467;
      }

      .obwd-field-full {
        grid-column: 1 / -1;
      }

      .obwd-request-intro {
        margin: 0 0 16px;
        font-size: 13px;
        color: #475467;
      }

      .obwd-request-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      .obwd-request-meta p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-activity-list {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .obwd-activity-list li {
        position: relative;
        padding: 0 0 14px 18px;
        font-size: 12px;
        color: #475467;
      }

      .obwd-activity-list li::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 5px;
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: #98a2b3;
      }

      .obwd-activity-list li:not(:last-child)::after {
        content: '';
        position: absolute;
        left: 6px;
        top: 14px;
        bottom: 0;
        width: 1px;
        background: #e4e7ec;
      }

      .obwd-activity-list strong {
        display: block;
        color: #1d2939;
      }

      .obwd-screen-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
      }

      .obwd-required {
        color: #d92d20;
      }

      .obwd-stage-tabs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        overflow-x: auto;
        border-bottom: 1px solid #e4e7ec;
        background: #fbfcfd;
      }

      .obwd-stage-tab {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 62px;
        padding: 10px 12px;
        border: 0;
        border-right: 1px solid #eaecf0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #475467;
        text-align: left;
        cursor: pointer;
      }

      .obwd-stage-tab:last-child {
        border-right: 0;
      }

      .obwd-stage-tab strong,
      .obwd-stage-tab small {
        display: block;
      }

      .obwd-stage-tab strong {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .obwd-stage-tab small {
        margin-top: 2px;
        font-size: 10px;
        color: #98a2b3;
      }

      .obwd-stage-tab.is-active {
        border-bottom-color: #3155a5;
        background: #f4f7ff;
        color: #27468d;
      }

      .obwd-stage-tab.is-completed .obwd-stage-icon {
        border-color: #12b76a;
        background: #12b76a;
        color: #fff;
      }

      .obwd-stage-tab.is-rejected .obwd-stage-icon,
      .obwd-stage-tab.is-sent-back .obwd-stage-icon {
        border-color: #f04438;
        background: #fef3f2;
        color: #d92d20;
      }

      .obwd-stage-tab:disabled {
        cursor: not-allowed;
        opacity: 0.64;
      }

      .obwd-stage-icon {
        display: grid;
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        place-items: center;
        border: 1px solid #98a2b3;
        border-radius: 50%;
        background: #fff;
        font-size: 11px;
      }

      .obwd-stage-body {
        padding: 16px;
      }

      .obwd-stage-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .obwd-stage-heading h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-stage-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-lock-copy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        color: #667085;
      }

      .obwd-stage-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.75fr);
        gap: 20px;
        align-items: start;
      }

      .obwd-stage-main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      .obwd-stage-fields {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .obwd-remarks {
        display: flex;
        flex-direction: column;
        margin-top: 14px;
      }

      .obwd-remarks textarea {
        min-height: 96px;
      }

      .obwd-checklist-panel {
        display: flex;
        flex-direction: column;
        height: auto;
        overflow: visible;
        border: 1px solid #e4e7ec;
        border-radius: 7px;
        background: #fbfcfd;
      }

      .obwd-stage-grid > .obwd-checklist-panel {
        position: sticky;
        top: 12px;
        height: auto;
        align-self: start;
      }

      .obwd-asset-clearance .obwd-checklist-panel {
        margin-top: 8px;
        position: static;
      }

      .obwd-checklist-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid #eaecf0;
      }

      .obwd-checklist-header h4 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-checklist-header p {
        margin: 0;
        font-size: 10px;
        color: #667085;
      }

      .obwd-checklist-count {
        padding: 3px 8px;
        border-radius: 10px;
        background: #e9effb;
        font-size: 11px;
        font-weight: 700;
        color: #3155a5;
      }

      .obwd-checklist-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        flex: 0 0 auto;
        min-height: 40px;
        padding: 10px 14px;
        border-bottom: 1px solid #f0f1f3;
        font-size: 12px;
        color: #344054;
      }

      .obwd-checklist-item:last-child {
        border-bottom: 0;
      }

      .obwd-checklist-item input {
        margin-top: 2px;
      }

      .obwd-stage-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-height: 48px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
        flex-wrap: wrap;
      }

      .obwd-template-card .obwd-card-body {
        padding: 12px 16px;
      }

      .obwd-template-compact-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .obwd-template-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #344054;
      }

      .obwd-template-summary strong {
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-template-chip {
        padding: 2px 8px;
        border-radius: 10px;
        background: #f2f4f7;
        font-size: 11px;
        color: #667085;
      }

      .obwd-template-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eef0f3;
      }

      .obwd-template-toolbar .obwd-field {
        min-width: 200px;
        margin: 0;
      }

      .obwd-template-toolbar .obwd-field label {
        margin-bottom: 2px;
        font-size: 11px;
      }

      .obwd-template-stages {
        display: grid;
        gap: 6px;
      }

      .obwd-template-stage {
        border: 1px solid #e4e7ec;
        border-radius: 6px;
        background: #fff;
        overflow: hidden;
      }

      .obwd-template-stage.is-disabled {
        opacity: 0.72;
        background: #f9fafb;
      }

      .obwd-template-stage-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        background: #fff;
      }

      .obwd-template-stage.is-expanded .obwd-template-stage-header {
        border-bottom: 1px solid #eef0f3;
      }

      .obwd-template-stage-header label {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: #1d2939;
        cursor: pointer;
      }

      .obwd-template-stage-header label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .obwd-template-count {
        flex: 0 0 auto;
        font-size: 10px;
        color: #667085;
      }

      .obwd-template-expand {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid #e4e7ec;
        border-radius: 5px;
        background: #fff;
        color: #475467;
        cursor: pointer;
      }

      .obwd-template-expand:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .obwd-template-tasks {
        padding: 6px 10px 8px 34px;
        display: grid;
        gap: 4px;
      }

      .obwd-template-task {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #475467;
      }

      .obwd-template-task input {
        margin: 0;
      }

      .obwd-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgb(16 24 40 / 45%);
      }

      .obwd-modal {
        display: flex;
        flex-direction: column;
        width: min(640px, 100%);
        max-height: min(82vh, 760px);
        overflow: hidden;
        border: 1px solid #e4e7ec;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(16 24 40 / 18%);
      }

      .obwd-modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid #e4e7ec;
      }

      .obwd-modal-header h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-modal-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-modal-close {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        padding: 0;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: #475467;
        cursor: pointer;
      }

      .obwd-modal-body {
        flex: 1;
        overflow: auto;
        padding: 16px 18px;
      }

      .obwd-modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid #e4e7ec;
        background: #fbfcfd;
      }

      .obwd-sticky-footer {
        position: fixed;
        z-index: 20;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 62px;
        padding: 10px 0;
        border-top: 1px solid #dfe3e8;
        background: rgb(255 255 255 / 96%);
        box-shadow: 0 -4px 12px rgb(16 24 40 / 6%);
        backdrop-filter: blur(8px);
      }

      .obwd-sticky-footer .obwd-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .obwd-sticky-footer p {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      @media (max-width: 1100px) {
        .obwd-stage-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 767px) {
        .obwd-page-header .obwd-container,
        .obwd-summary-top,
        .obwd-details-actions,
        .obwd-sticky-footer .obwd-container,
        .obwd-template-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .obwd-container {
          padding-left: 12px;
          padding-right: 12px;
        }

        .obwd-page-content {
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .obwd-form-grid,
        .obwd-stage-fields,
        .obwd-asset-counts {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="obwd-root" id="app"></div>

    <script>
      const EMPLOYEE = {
        id: 'EMP1052',
        name: 'Rohit Kapoor',
        designation: 'Senior Software Engineer',
        manager: 'Vasu Devalla',
        entity: 'Nemo IT Solutions',
        department: 'Engineering',
        resignationDate: '—',
        proposedLwd: '—',
        approvedLwd: '—',
        reason: '—',
        noticePeriod: '30 days',
        leaveBalance: 12,
        leaveTypes: [
          { code: 'EL', name: 'Earned Leave', balance: 8, maxEncashable: 8 },
          { code: 'CL', name: 'Casual Leave', balance: 4, maxEncashable: 0 },
        ],
        assets: [
          { id: 'laptop', name: 'MacBook Pro 14"', returned: false },
          { id: 'access-card', name: 'Office access card', returned: true },
          { id: 'id-card', name: 'Employee ID card', returned: false },
        ],
      };

      const REASON_FOR_LEAVING_OPTIONS = [
        'Better Job Opportunity',
        'Higher Education',
        'Health Issues',
        'Personal or Family Reasons',
        'Seeking Higher Compensation',
        'Others',
      ];

      const CLEARANCE_STAGE_IDS = ['manager', 'admin', 'finance'];

      const TEMPLATE_PRESETS = {
        standard: 'Standard Offboarding',
        minimal: 'Minimal (no Finance)',
      };

      function createDefaultTemplate() {
        return {
          preset: 'standard',
          name: 'Standard Offboarding',
          stages: [
            {
              id: 'resignation',
              label: 'Resignation Approval',
              ownerRole: 'manager',
              defaultAssignee: 'Vasu Devalla',
              enabled: true,
              tasks: [
                {
                  id: 'reason-reviewed',
                  label: 'Resignation reason reviewed',
                  enabled: true,
                },
                {
                  id: 'lwd-reviewed',
                  label: 'Proposed last working date reviewed',
                  enabled: true,
                },
              ],
            },
            {
              id: 'manager',
              label: 'Manager Clearance',
              ownerRole: 'manager',
              defaultAssignee: 'Vasu Devalla',
              enabled: true,
              tasks: [
                {
                  id: 'kt',
                  label: 'Knowledge transfer completed',
                  enabled: true,
                },
                {
                  id: 'tasks',
                  label: 'Pending tasks reassigned',
                  enabled: true,
                },
                {
                  id: 'handover',
                  label: 'Team handover completed',
                  enabled: true,
                },
                {
                  id: 'information',
                  label: 'Company information handed over',
                  enabled: true,
                },
                {
                  id: 'manager-dues',
                  label: 'No manager-level clearance pending',
                  enabled: true,
                },
              ],
            },
            {
              id: 'admin',
              label: 'Admin Clearance',
              ownerRole: 'admin',
              defaultAssignee: 'Akash Verma',
              enabled: true,
              tasks: [
                { id: 'id-card', label: 'ID card returned', enabled: true },
                {
                  id: 'access-card',
                  label: 'Access card returned',
                  enabled: true,
                },
                { id: 'keys', label: 'Office keys returned', enabled: true },
                {
                  id: 'admin-dues',
                  label: 'Administrative dues cleared',
                  enabled: true,
                },
                {
                  id: 'property',
                  label: 'Company property & IT assets returned',
                  enabled: true,
                },
              ],
            },
            {
              id: 'finance',
              label: 'Finance Clearance',
              ownerRole: 'finance',
              defaultAssignee: 'Neha Gupta',
              enabled: true,
              tasks: [
                {
                  id: 'advances',
                  label: 'Salary advances verified',
                  enabled: true,
                },
                {
                  id: 'recoveries',
                  label: 'Loans or recoveries verified',
                  enabled: true,
                },
                {
                  id: 'reimbursements',
                  label: 'Reimbursements cleared',
                  enabled: true,
                },
                {
                  id: 'deductions',
                  label: 'Pending deductions recorded',
                  enabled: true,
                },
                {
                  id: 'finance-dues',
                  label: 'Finance dues cleared',
                  enabled: true,
                },
              ],
            },
            {
              id: 'hr',
              label: 'HR Final Clearance',
              ownerRole: 'hr',
              defaultAssignee: 'Priya Sharma',
              enabled: true,
              tasks: [
                {
                  id: 'exit-interview',
                  label: 'Exit interview completed',
                  enabled: true,
                },
                {
                  id: 'documents',
                  label: 'Required documents collected',
                  enabled: true,
                },
                {
                  id: 'encashment',
                  label: 'Leave encashment reviewed',
                  enabled: true,
                },
                {
                  id: 'clearances',
                  label: 'All mandatory clearances completed',
                  enabled: true,
                },
                {
                  id: 'separation',
                  label: 'Employee ready for separation',
                  enabled: true,
                },
              ],
            },
          ],
        };
      }

      const DEFAULT_RUNTIME = {
        resignation: {
          status: 'Completed',
          completedOn: '03 May 2026',
          remarks:
            'Resignation accepted. Complete the handover plan before release.',
          checklist: { 'reason-reviewed': true, 'lwd-reviewed': true },
        },
        manager: {
          status: 'Completed',
          completedOn: '18 May 2026',
          remarks: 'Knowledge transfer and team handover are complete.',
          checklist: {
            kt: true,
            tasks: true,
            handover: true,
            information: true,
            'manager-dues': true,
          },
        },
        admin: {
          status: 'In Progress',
          completedOn: '—',
          remarks: 'ID card received. Access card and office keys are pending.',
          checklist: {
            'id-card': true,
            'access-card': false,
            keys: false,
            'admin-dues': true,
            property: false,
          },
        },
        finance: {
          status: 'In Progress',
          completedOn: '—',
          remarks:
            'Salary advance verified. Loan recovery and reimbursements pending.',
          checklist: {
            advances: true,
            recoveries: false,
            reimbursements: false,
            deductions: false,
            'finance-dues': false,
          },
        },
        hr: {
          status: 'Pending',
          completedOn: '—',
          remarks: '',
          checklist: {
            'exit-interview': false,
            documents: false,
            encashment: false,
            clearances: false,
            separation: false,
          },
        },
      };

      const BADGE_COLORS = {
        Completed: '#33ba41',
        'In Progress': '#fd7e14',
        'In Clearance': '#fd7e14',
        Pending: '#6b6b6b',
        Locked: '#6b6b6b',
        Rejected: '#e34646',
        'Sent Back': '#e34646',
        'Ready for F&F': '#2e65b6',
      };

      const state = {
        role: 'employee',
        prototypeStep: null,
        requestId: '',
        requestStatus: 'draft',
        approvedLastDate: '',
        hrRemarks: '',
        resignationRequest: {
          reason_for_leaving: '',
          desired_last_date: '',
          reason: '',
          comments: '',
          submittedOn: '',
        },
        template: createDefaultTemplate(),
        templateModalOpen: false,
        expandedTemplateStageId: null,
        runtime: createFreshRuntime(createDefaultTemplate()),
        selectedStageId: 'resignation',
        initiateExit: false,
        readyForFf: false,
        hrFinal: {
          approvedEncashment: 8,
          separationReason: 'Voluntary resignation',
          assets: EMPLOYEE.assets.map((asset) => ({ ...asset })),
        },
        notice: '',
        validation: '',
      };

      function getLeaveTotals() {
        const available = EMPLOYEE.leaveTypes.reduce(
          (sum, item) => sum + item.balance,
          0
        );
        const maxEncashable = EMPLOYEE.leaveTypes.reduce(
          (sum, item) => sum + item.maxEncashable,
          0
        );
        return {
          available: EMPLOYEE.leaveBalance || available,
          maxEncashable,
        };
      }

      function getAssetCounts() {
        const assets = state.hrFinal.assets || [];
        const total = assets.length;
        const returned = assets.filter((asset) => asset.returned).length;
        return {
          total,
          returned,
          pending: total - returned,
        };
      }

      function createFreshRuntime(template) {
        const runtime = {};
        template.stages
          .filter((stage) => stage.enabled)
          .forEach((stage) => {
            runtime[stage.id] = {
              status: 'Pending',
              completedOn: '—',
              remarks: '',
              checklist: Object.fromEntries(
                stage.tasks
                  .filter((task) => task.enabled)
                  .map((task) => [task.id, false])
              ),
            };
          });
        return runtime;
      }

      function formatDisplayDate(value) {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return value;
        return date.toLocaleDateString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: 'numeric',
        });
      }

      function getReasonLabel() {
        const request = state.resignationRequest;
        if (request.reason_for_leaving === 'Others') {
          return request.reason?.trim() || 'Others';
        }
        return request.reason_for_leaving || '—';
      }

      function syncEmployeeFromRequest() {
        const request = state.resignationRequest;
        EMPLOYEE.resignationDate =
          request.submittedOn ||
          formatDisplayDate(new Date().toISOString().slice(0, 10));
        EMPLOYEE.proposedLwd = formatDisplayDate(request.desired_last_date);
        EMPLOYEE.approvedLwd = formatDisplayDate(
          state.approvedLastDate || request.desired_last_date
        );
        EMPLOYEE.reason = getReasonLabel();
      }

      function ensureApprovedLastDateDefault() {
        if (
          !state.approvedLastDate &&
          state.resignationRequest.desired_last_date
        ) {
          state.approvedLastDate = state.resignationRequest.desired_last_date;
        }
      }

      function getFlowStepId() {
        if (state.prototypeStep) return state.prototypeStep;
        if (state.requestStatus === 'completed') return 'offboarding';
        if (state.requestStatus === 'draft') return 'apply';
        return 'hr-review';
      }

      function getFlowStepStatus(stepId) {
        const activeStep = getFlowStepId();
        const order = ['apply', 'hr-review', 'offboarding'];
        const stepIndex = order.indexOf(stepId);
        const activeIndex = order.indexOf(activeStep);

        if (state.prototypeStep) {
          if (stepId === activeStep) return 'active';
          if (stepIndex < activeIndex) return 'complete';
          return 'upcoming';
        }

        if (stepId === 'apply') {
          if (state.requestStatus !== 'draft') return 'complete';
          return 'active';
        }
        if (stepId === 'hr-review') {
          if (state.requestStatus === 'completed') return 'complete';
          if (state.requestStatus !== 'draft') return 'active';
          return 'upcoming';
        }
        if (stepId === 'offboarding') {
          return state.requestStatus === 'completed' ? 'active' : 'upcoming';
        }
        return 'upcoming';
      }

      function renderRoleGate(title, description, hint) {
        return `${renderPrototypeBanner()}
          ${renderPageHeader(
            'Resignation & Offboarding',
            'Employees / Offboarding'
          )}
          <main class="obwd-page-content obwd-container">
            ${renderFlowStepper()}
            <section class="obwd-card obwd-role-gate">
              <div class="obwd-card-body">
                <h2>${escapeHtml(title)}</h2>
                <p>${escapeHtml(description)}</p>
                <p class="obwd-muted">${escapeHtml(hint)}</p>
              </div>
            </section>
          </main>`;
      }

      function renderHrEmptyScreen() {
        return renderRoleGate(
          'No resignation request to review',
          'HR can accept resignation requests only after an employee submits one from External Requests.',
          'Open the Submit resignation step to create a request for this prototype.'
        );
      }

      function renderWaitingScreen() {
        return renderRoleGate(
          'Offboarding not started yet',
          'Department clearance begins only after HR accepts the resignation request.',
          'Open the Submit resignation or HR acceptance step first.'
        );
      }

      function resolveActiveView() {
        if (state.prototypeStep === 'apply') return 'apply';
        if (state.prototypeStep === 'hr-review') return 'hr-review';
        if (state.prototypeStep === 'offboarding') return 'offboarding';

        if (state.requestStatus === 'completed') {
          return state.role === 'employee' ? 'apply' : 'offboarding';
        }
        if (state.role === 'employee') {
          return 'apply';
        }
        if (state.role === 'hr') {
          return state.requestStatus === 'draft' ? 'hr-empty' : 'hr-review';
        }
        return 'waiting';
      }

      function ensurePreviewRequestData() {
        if (state.resignationRequest.reason_for_leaving) {
          syncEmployeeFromRequest();
          return;
        }

        state.resignationRequest = {
          reason_for_leaving: 'Better Job Opportunity',
          desired_last_date: '2026-05-31',
          reason: '',
          comments: 'Relocating to Bangalore',
          submittedOn: formatDisplayDate(new Date().toISOString().slice(0, 10)),
        };
        state.requestId = state.requestId || 'REQ-2026-0142';
        state.approvedLastDate =
          state.approvedLastDate || state.resignationRequest.desired_last_date;
        syncEmployeeFromRequest();
      }

      function ensurePreviewOffboardingData() {
        ensurePreviewRequestData();
        if (state.requestStatus !== 'completed') {
          state.runtime = structuredClone(DEFAULT_RUNTIME);
          state.selectedStageId = 'admin';
          state.initiateExit = true;
        }
      }

      function canEmployeeEditRequest() {
        return (
          state.role === 'employee' &&
          ['draft', 'sent_back'].includes(state.requestStatus)
        );
      }

      function renderFlowStepper() {
        const activeScreen = getFlowStepId();
        const steps = [
          { id: 'apply', title: 'Submit resignation', hint: 'Employee only' },
          { id: 'hr-review', title: 'HR acceptance', hint: 'HR only' },
          {
            id: 'offboarding',
            title: 'Offboarding & clearance',
            hint: 'Department workflow',
          },
        ];

        return `<nav class="obwd-flow-stepper" aria-label="Resignation journey">
          ${steps
            .map((step, index) => {
              const status = getFlowStepStatus(step.id);
              const isActive = step.id === activeScreen;
              const isComplete = status === 'complete';
              return `<button type="button" class="obwd-flow-step ${
                isActive ? 'is-active' : ''
              } ${isComplete ? 'is-complete' : ''}" aria-current="${
                isActive ? 'step' : 'false'
              }" onclick="goToPrototypeStep('${step.id}')">
                <span class="obwd-flow-step-index">${
                  isComplete ? '✓' : index + 1
                }</span>
                <span>
                  <strong>${escapeHtml(step.title)}</strong>
                  <small>${escapeHtml(step.hint)}</small>
                </span>
              </button>`;
            })
            .join('')}
        </nav>`;
      }

      function renderPrototypeBanner(extra = '') {
        return `<div class="obwd-prototype-banner">
          <div class="obwd-container">
            <strong>Design prototype only.</strong>
            Employee submits resignation, HR accepts it, then department offboarding begins.
            Click any step above to preview that screen directly.
            ${extra ? `<span> ${extra}</span>` : ''}
          </div>
        </div>`;
      }

      function renderPageHeader(title, subtitle) {
        return `<header class="obwd-page-header">
          <div class="obwd-container">
            <div class="obwd-header-left">
              <button type="button" class="obwd-back-button" aria-label="Back" onclick="history.back()">←</button>
              <div>
                <h1>${escapeHtml(title)}</h1>
                <p>${escapeHtml(subtitle)}</p>
              </div>
            </div>
          </div>
        </header>`;
      }

      function renderRequestStatusBadge() {
        const map = {
          draft: 'Draft',
          pending: 'Pending on Processor',
          completed: 'Completed',
          rejected: 'Rejected',
          sent_back: 'Sent Back',
        };
        const colorMap = {
          Draft: '#6b6b6b',
          'Pending on Processor': '#fd7e14',
          Completed: '#33ba41',
          Rejected: '#e34646',
          'Sent Back': '#e34646',
        };
        const label = map[state.requestStatus] || 'Draft';
        const color = colorMap[label] || '#6b6b6b';
        return `<span class="obwd-badge" style="background:${color}">${escapeHtml(
          label
        )}</span>`;
      }

      function cloneTemplate(template) {
        return structuredClone(template);
      }

      function buildStagesFromTemplate(template, runtime) {
        return template.stages
          .filter((stage) => stage.enabled)
          .map((stageDef) => {
            const saved = runtime[stageDef.id] || {};
            return {
              id: stageDef.id,
              label: stageDef.label,
              ownerRole: stageDef.ownerRole,
              assignee: saved.assignee || stageDef.defaultAssignee,
              status: saved.status || 'Pending',
              completedOn: saved.completedOn || '—',
              remarks: saved.remarks || '',
              checklist: stageDef.tasks
                .filter((task) => task.enabled)
                .map((task) => ({
                  id: task.id,
                  label: task.label,
                  checked: Boolean(saved.checklist?.[task.id]),
                })),
            };
          });
      }

      function syncRuntimeFromStages(stages) {
        stages.forEach((stage) => {
          state.runtime[stage.id] = {
            status: stage.status,
            completedOn: stage.completedOn,
            remarks: stage.remarks,
            assignee: stage.assignee,
            checklist: Object.fromEntries(
              stage.checklist.map((item) => [item.id, item.checked])
            ),
          };
        });
      }

      function getStages() {
        return buildStagesFromTemplate(state.template, state.runtime);
      }

      function applyPreset(preset) {
        const template = createDefaultTemplate();
        template.preset = preset;
        template.name = TEMPLATE_PRESETS[preset];

        if (preset === 'minimal') {
          const finance = template.stages.find((s) => s.id === 'finance');
          if (finance) finance.enabled = false;
        }

        state.template = template;
        state.expandedTemplateStageId = null;
        rebuildEmployeeWorkflow(
          `Loaded ${template.name} template. Employee workflow updated.`
        );
      }

      function rebuildEmployeeWorkflow(noticeMessage) {
        syncRuntimeFromStages(getStages());
        const stages = getStages();
        if (!stages.some((stage) => stage.id === state.selectedStageId)) {
          state.selectedStageId =
            stages.find((stage) => stage.status === 'In Progress')?.id ||
            stages[0]?.id ||
            'resignation';
        }
        if (noticeMessage) state.notice = noticeMessage;
        state.validation = '';
        render();
      }

      function toggleTemplateStage(stageId, enabled) {
        const stage = state.template.stages.find((item) => item.id === stageId);
        if (!stage) return;
        stage.enabled = enabled;
        if (!enabled && state.expandedTemplateStageId === stageId) {
          state.expandedTemplateStageId = null;
        }
        rebuildEmployeeWorkflow(
          `${stage.label} ${enabled ? 'enabled' : 'removed'} for this employee.`
        );
      }

      function toggleTemplateTask(stageId, taskId, enabled) {
        const stage = state.template.stages.find((item) => item.id === stageId);
        const task = stage?.tasks.find((item) => item.id === taskId);
        if (!task) return;
        task.enabled = enabled;
        rebuildEmployeeWorkflow(
          `Task "${task.label}" ${enabled ? 'added' : 'removed'} from ${
            stage.label
          }.`
        );
      }

      function badge(status) {
        const color = BADGE_COLORS[status] || '#6b6b6b';
        return `<span class="obwd-badge" style="background:${color}">${escapeHtml(
          status
        )}</span>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function stageIcon(status) {
        if (status === 'Completed') return '✓';
        if (status === 'Locked') return '🔒';
        if (status === 'Rejected' || status === 'Sent Back') return '!';
        return '⏱';
      }

      function getSelectedStage(stages) {
        return stages.find((stage) => stage.id === state.selectedStageId);
      }

      function isResignationApproved(stages) {
        const resignation = stages.find((stage) => stage.id === 'resignation');
        return resignation?.status === 'Completed';
      }

      function getActiveClearanceIds(stages) {
        return CLEARANCE_STAGE_IDS.filter((id) =>
          stages.some((stage) => stage.id === id)
        );
      }

      function areClearancesComplete(stages) {
        const clearanceIds = getActiveClearanceIds(stages);
        return clearanceIds.every((id) => {
          const stage = stages.find((item) => item.id === id);
          return stage?.status === 'Completed';
        });
      }

      function isStageLocked(stage, stages) {
        return false;
      }

      function stageLockMessage(stage, stages) {
        return '';
      }

      function getDerived() {
        const stages = getStages();
        const completedCount = stages.filter(
          (stage) => stage.status === 'Completed'
        ).length;
        const allStagesCompleted = stages.every(
          (stage) => stage.status === 'Completed'
        );
        const inProgressStages = stages.filter(
          (stage) => stage.status === 'In Progress'
        );
        const pendingStages = stages.filter(
          (stage) =>
            !['Completed', 'Rejected', 'Sent Back'].includes(stage.status)
        );
        const currentStage =
          inProgressStages.length > 1
            ? {
                label: `${inProgressStages.length} clearances in progress`,
                status: 'In Progress',
              }
            : inProgressStages[0] ||
              pendingStages[0] ||
              stages[stages.length - 1];
        const selectedStage = getSelectedStage(stages);
        const selectedIndex = stages.findIndex(
          (stage) => stage.id === state.selectedStageId
        );
        const stageLocked = false;
        const canUpdate = Boolean(selectedStage);
        const canAssign = Boolean(selectedStage);
        const overallBadgeStatus = state.readyForFf
          ? 'Ready for F&F'
          : stages.some((stage) => stage.status === 'Rejected')
          ? 'Rejected'
          : 'In Clearance';
        const progress = stages.length
          ? Math.round((completedCount / stages.length) * 100)
          : 0;
        const pendingClearances = stages
          .filter(
            (stage) =>
              getActiveClearanceIds(stages).includes(stage.id) &&
              stage.status !== 'Completed'
          )
          .map((stage) => stage.label);

        return {
          stages,
          completedCount,
          allStagesCompleted,
          currentStage,
          selectedStage,
          selectedIndex,
          stageLocked,
          stageLockMessage: selectedStage
            ? stageLockMessage(selectedStage, stages)
            : '',
          canUpdate,
          canAssign,
          overallBadgeStatus,
          progress,
          pendingClearances,
        };
      }

      function getTemplateSummary() {
        const enabledStages = state.template.stages.filter(
          (stage) => stage.enabled
        );
        const taskCount = enabledStages.reduce(
          (sum, stage) =>
            sum + stage.tasks.filter((task) => task.enabled).length,
          0
        );
        return {
          stageCount: enabledStages.length,
          taskCount,
        };
      }

      function renderField(label, value) {
        return `<div class="obwd-field"><label>${escapeHtml(
          label
        )}</label><input readonly value="${escapeHtml(value)}" /></div>`;
      }

      function renderTemplateStageBlocks() {
        return state.template.stages
          .map((stage) => {
            const lockedStage = false;
            const enabledTasks = stage.tasks.filter((task) => task.enabled);
            const isExpanded =
              stage.enabled && state.expandedTemplateStageId === stage.id;
            const tasks = stage.tasks
              .map(
                (task) => `<label class="obwd-template-task">
                  <input type="checkbox" ${
                    task.enabled ? 'checked' : ''
                  } onchange="toggleTemplateTask('${stage.id}', '${
                  task.id
                }', this.checked)" />
                  <span>${escapeHtml(task.label)}</span>
                </label>`
              )
              .join('');

            return `<div class="obwd-template-stage ${
              stage.enabled ? '' : 'is-disabled'
            } ${isExpanded ? 'is-expanded' : ''}">
              <div class="obwd-template-stage-header">
                <label>
                  <input type="checkbox" ${stage.enabled ? 'checked' : ''} ${
              lockedStage ? 'disabled' : ''
            } onchange="toggleTemplateStage('${stage.id}', this.checked)" />
                  <span>${escapeHtml(stage.label)}</span>
                </label>
                <span class="obwd-template-count">${
                  stage.enabled
                    ? `${enabledTasks.length}/${stage.tasks.length} tasks`
                    : 'Off'
                }</span>
                <button type="button" class="obwd-template-expand" ${
                  stage.enabled ? '' : 'disabled'
                } aria-label="Toggle tasks" onclick="toggleTemplateStageAccordion('${
              stage.id
            }')">${isExpanded ? '▾' : '▸'}</button>
              </div>
              ${
                isExpanded
                  ? `<div class="obwd-template-tasks">${tasks}</div>`
                  : ''
              }
            </div>`;
          })
          .join('');
      }

                            </div>
                          </div>`;
                          })()
                        : ''
                    }

                    <div class="obwd-remarks obwd-field">
                      <label>Remarks</label>
                      <textarea rows="4" placeholder="Add remarks. Required for Reject and Send Back." oninput="setRemarks(this.value)">${escapeHtml(
                        stage.remarks
                      )}</textarea>
                    </div>
                  </div>

                  <div class="obwd-checklist-panel">
                    <div class="obwd-checklist-header">
                      <div>
                        <h4>Mandatory checklist</h4>
                        <p>All items must be complete before approval.</p>
                      </div>
                      <span class="obwd-checklist-count">${checkedCount}/${
          stage.checklist.length
        }</span>
                    </div>
                    <div>
                      ${
                        stage.checklist.length
                          ? stage.checklist
                              .map(
                                (item) => `<label class="obwd-checklist-item">
                                  <input type="checkbox" ${
                                    item.checked ? 'checked' : ''
                                  } onchange="toggleChecklist('${
                                  item.id
                                }', this.checked)" />
                                  <span>${escapeHtml(item.label)}</span>
                                </label>`
                              )
                              .join('')
                          : '<p class="obwd-muted" style="padding:12px 14px">No tasks configured for this stage.</p>'
                      }
                    </div>
                  </div>
                </div>

                ${
                  state.validation
                    ? `<div class="obwd-alert obwd-alert-danger" style="margin-top:16px">${escapeHtml(
                        state.validation
                      )}</div>`
                    : ''
                }

                <div class="obwd-stage-actions">
                  <button type="button" class="obwd-btn obwd-btn-danger" onclick="performDecision('Rejected')">Reject</button>
                  <button type="button" class="obwd-btn obwd-btn-secondary" onclick="performDecision('Sent Back')">↺ Send Back</button>
                  <button type="button" class="obwd-btn obwd-btn-secondary" onclick="save()">Save</button>
                  <button type="button" class="obwd-btn obwd-btn-primary" onclick="performDecision('Completed')">✓ Approve</button>
                </div>
              </div>
            </section>
          </main>

          <footer class="obwd-sticky-footer">
            <div class="obwd-container">
              <p>🛡 Final F&amp;F processing remains in greytHR.</p>
              <div class="obwd-actions">
                <button type="button" class="obwd-btn obwd-btn-secondary" onclick="resetScenario()">Cancel</button>
                <button type="button" class="obwd-btn obwd-btn-secondary" onclick="save()">Save</button>
                <button type="button" class="obwd-btn obwd-btn-primary" onclick="moveToFf()">
                  ${
                    state.readyForFf ? 'Ready for F&F' : 'Move to Ready for F&F'
                  }
                </button>
              </div>
            </div>
          </footer>
        `;
      }

      function render() {
        const view = resolveActiveView();
        const views = {
          apply: renderApplyScreen,
          'hr-review': renderHrReviewScreen,
          'hr-empty': renderHrEmptyScreen,
          waiting: renderWaitingScreen,
        };

        if (views[view]) {
          document.getElementById('app').innerHTML = views[view]();
          return;
        }

        renderOffboardingScreen();
      }

      window.goToPrototypeStep = function (step) {
        state.prototypeStep = step;
        state.validation = '';
        state.notice = '';

        if (step === 'apply') {
          state.role = 'employee';
        }

        if (step === 'hr-review') {
          state.role = 'hr';
          ensurePreviewRequestData();
          ensureApprovedLastDateDefault();
          if (state.requestStatus === 'draft') {
            state.requestStatus = 'pending';
          }
        }

        if (step === 'offboarding') {
          state.role = 'hr';
          ensurePreviewOffboardingData();
        }

        render();
      };

      window.setResignationField = function (field, value) {
        state.resignationRequest[field] = value;
        if (field === 'reason_for_leaving' && value !== 'Others') {
          state.resignationRequest.reason = '';
        }
        state.validation = '';
        if (field === 'reason_for_leaving') {
          render();
        }
      };

      window.setApprovedLastDate = function (value) {
        state.approvedLastDate = value;
        syncEmployeeFromRequest();
        state.validation = '';
      };

      window.setHrFinalField = function (field, value) {
        state.hrFinal[field] = value;
        state.validation = '';
      };

      window.setApprovedEncashment = function (value) {
        const maxEncashable = getLeaveTotals().maxEncashable;
        const next = Math.max(0, Math.min(maxEncashable, Number(value) || 0));
        state.hrFinal.approvedEncashment = next;
        render();
      };

      window.toggleAssetReturned = function (assetId, returned) {
        const asset = state.hrFinal.assets.find((item) => item.id === assetId);
        if (!asset) return;
        asset.returned = Boolean(returned);
        render();
      };

      window.setHrRemarks = function (value) {
        state.hrRemarks = value;
        state.validation = '';
      };

      window.submitResignationRequest = function () {
        const request = state.resignationRequest;
        if (!request.reason_for_leaving) {
          state.validation = 'Please select the Reason For Leaving.';
          render();
          return;
        }
        if (!request.desired_last_date) {
          state.validation = 'Please select the Desired Last Working Date.';
          render();
          return;
        }
        if (request.reason_for_leaving === 'Others' && !request.reason.trim()) {
          state.validation =
            'Please mention the reason when Others is selected.';
          render();
          return;
        }

        state.requestId = 'REQ-2026-0142';
        state.requestStatus = 'pending';
        state.resignationRequest.submittedOn = formatDisplayDate(
          new Date().toISOString().slice(0, 10)
        );
        syncEmployeeFromRequest();
        state.prototypeStep = null;
        state.role = 'employee';
        state.validation = '';
        state.notice =
          'Resignation request submitted. Open the HR acceptance step to review it.';
        render();
      };

      window.approveResignationRequest = function () {
        if (!state.approvedLastDate) {
          state.validation =
            'Please confirm the Approved Last Working Date before approval.';
          render();
          return;
        }

        state.requestStatus = 'completed';
        syncEmployeeFromRequest();
        state.template = createDefaultTemplate();
        state.runtime = createFreshRuntime(state.template);
        state.selectedStageId = 'resignation';
        state.initiateExit = true;
        state.readyForFf = false;
        state.prototypeStep = 'offboarding';
        state.role = 'hr';
        state.validation = '';
        state.notice =
          'Resignation request approved. Open Offboarding & clearance to continue.';
        render();
      };

      window.rejectResignationRequest = function () {
        if (!state.hrRemarks.trim()) {
          state.validation = 'Remarks are required when rejecting a request.';
          render();
          return;
        }
        state.requestStatus = 'rejected';
        state.validation = '';
        state.notice =
          'Resignation request rejected. Employee will be notified.';
        render();
      };

      window.sendBackResignationRequest = function () {
        if (!state.hrRemarks.trim()) {
          state.validation =
            'Remarks are required when sending a request back.';
          render();
          return;
        }
        state.requestStatus = 'sent_back';
        state.validation = '';
        state.notice =
          'Request sent back to employee. Open the Submit resignation step to update and resubmit.';
        render();
      };

      window.openTemplateModal = function () {
        state.templateModalOpen = true;
        render();
      };

      window.closeTemplateModal = function (event) {
        if (event && event.target !== event.currentTarget) return;
        state.templateModalOpen = false;
        state.expandedTemplateStageId = null;
        render();
      };

      window.toggleTemplateStageAccordion = function (stageId) {
        state.expandedTemplateStageId =
          state.expandedTemplateStageId === stageId ? null : stageId;
        render();
      };

      window.resetTemplate = function () {
        state.template = createDefaultTemplate();
        state.expandedTemplateStageId = null;
        rebuildEmployeeWorkflow('Template reset to Standard Offboarding.');
      };

      window.selectStage = function (id) {
        const stages = getStages();
        const stage = stages.find((item) => item.id === id);
        if (!stage) return;
        state.selectedStageId = id;
        state.validation = '';
        render();
      };

      window.setInitiateExit = function (checked) {
        state.initiateExit = checked;
      };

      window.setAssignee = function (assignee) {
        const stages = getStages();
        const stage = stages.find((item) => item.id === state.selectedStageId);
        if (stage) {
          state.runtime[stage.id] = state.runtime[stage.id] || {};
          state.runtime[stage.id].assignee = assignee;
        }
        render();
      };

      window.setRemarks = function (remarks) {
        const stage = getSelectedStage(getStages());
        if (stage) {
          state.runtime[stage.id] = state.runtime[stage.id] || {};
          state.runtime[stage.id].remarks = remarks;
          state.validation = '';
        }
      };

      window.toggleChecklist = function (checkId, checked) {
        const stage = getSelectedStage(getStages());
        if (!stage) return;
        state.runtime[stage.id] = state.runtime[stage.id] || { checklist: {} };
        state.runtime[stage.id].checklist =
          state.runtime[stage.id].checklist || {};
        state.runtime[stage.id].checklist[checkId] = checked;
        state.notice = '';
        render();
      };

      window.performDecision = function (decision) {
        const d = getDerived();
        const stage = d.selectedStage;
        if (!stage) return;

        if (
          ['Rejected', 'Sent Back'].includes(decision) &&
          !stage.remarks.trim()
        ) {
          state.validation = `Remarks are required when a stage is ${decision.toLowerCase()}.`;
          render();
          return;
        }
        if (
          decision === 'Completed' &&
          stage.checklist.some((item) => !item.checked)
        ) {
          state.validation =
            'Complete every mandatory checklist item before approving this stage.';
          render();
          return;
        }

        state.runtime[stage.id] = state.runtime[stage.id] || {};
        state.runtime[stage.id].status = decision;
        state.runtime[stage.id].completedOn =
          decision === 'Completed' ? '01 Sep 2026' : '—';

        if (decision === 'Completed' && stage.id === 'resignation') {
          getActiveClearanceIds(d.stages).forEach((id) => {
            if (state.runtime[id]?.status === 'Pending') {
              state.runtime[id].status = 'In Progress';
            }
          });
        }

        if (decision === 'Completed') {
          const stagesAfter = getStages();
          if (stage.id !== 'hr' && areClearancesComplete(stagesAfter)) {
            if (state.runtime.hr?.status === 'Pending') {
              state.runtime.hr.status = 'In Progress';
            }
          }
        }

        state.validation = '';
        if (decision === 'Completed') {
          if (stage.id === 'resignation') {
            state.notice =
              'Resignation approved. Enabled department clearances can now run in parallel.';
          } else if (stage.id === 'hr') {
            state.notice =
              'HR final clearance approved. All stages are complete — ready for F&F handoff.';
          } else {
            const remaining = getActiveClearanceIds(getStages()).filter(
              (id) => {
                const item = state.runtime[id];
                return item?.status !== 'Completed';
              }
            );
            state.notice =
              remaining.length > 0
                ? `${stage.label} approved. ${remaining.length} clearance stage(s) still pending.`
                : `${stage.label} approved. HR final clearance is now available.`;
          }
        } else {
          state.notice = `${stage.label} marked ${decision}. Review and update as needed.`;
        }
        render();
      };

      window.save = function () {
        state.notice = 'Prototype changes saved for this resignation record.';
        render();
      };

      window.resetScenario = function () {
        state.role = 'employee';
        state.prototypeStep = null;
        state.requestId = '';
        state.requestStatus = 'draft';
        state.approvedLastDate = '';
        state.hrRemarks = '';
        state.hrFinal = {
          approvedEncashment: 8,
          separationReason: 'Voluntary resignation',
          assets: EMPLOYEE.assets.map((asset) => ({ ...asset })),
        };
        state.resignationRequest = {
          reason_for_leaving: '',
          desired_last_date: '',
          reason: '',
          comments: '',
          submittedOn: '',
        };
        state.template = createDefaultTemplate();
        state.templateModalOpen = false;
        state.expandedTemplateStageId = null;
        state.runtime = createFreshRuntime(state.template);
        state.selectedStageId = 'resignation';
        state.initiateExit = false;
        state.readyForFf = false;
        state.validation = '';
        state.notice =
          'Prototype reset. Start with the employee resignation request.';
        EMPLOYEE.resignationDate = '—';
        EMPLOYEE.proposedLwd = '—';
        EMPLOYEE.approvedLwd = '—';
        EMPLOYEE.reason = '—';
        render();
      };

      window.moveToFf = function () {
        state.readyForFf = true;
        state.notice =
          'Employee moved to Ready for F&F. Final processing continues in greytHR.';
        render();
      };

      render();
    </script>
  </body>
</html>
