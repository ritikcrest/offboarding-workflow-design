<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resignation &amp; Offboarding Workflow — Design Artifact</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.45;
        color: #202939;
        background: #f6f7f9;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      .obwd-root {
        min-height: 100vh;
        padding-bottom: 76px;
      }

      .obwd-prototype-banner {
        padding: 10px 0;
        background: #eff6ff;
        border-bottom: 1px solid #bfdbfe;
        color: #1e3a8a;
        font-size: 13px;
      }

      .obwd-container {
        width: 100%;
        max-width: 1440px;
        margin: 0 auto;
        padding-left: 20px;
        padding-right: 20px;
      }

      .obwd-page-header {
        padding: 14px 0;
        border-bottom: 1px solid #e4e7ec;
        background: #fff;
      }

      .obwd-page-header .obwd-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .obwd-page-header h1 {
        margin: 0 0 4px;
        font-size: 18px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-page-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-header-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .obwd-back-button {
        display: grid;
        width: 34px;
        height: 34px;
        place-items: center;
        padding: 0;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: #344054;
        cursor: pointer;
      }

      .obwd-role-select {
        width: min(280px, 100%);
      }

      .obwd-role-select label {
        display: block;
        margin-bottom: 3px;
        font-size: 11px;
        font-weight: 600;
        color: #667085;
      }

      .obwd-role-select select {
        width: 100%;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 5px;
        font-size: 13px;
        background: #fff;
      }

      .obwd-page-content {
        padding-top: 16px;
        padding-bottom: 24px;
      }

      .obwd-card {
        margin-bottom: 16px;
        border: 1px solid #e4e7ec;
        border-radius: 8px;
        background: #fff;
        box-shadow: 0 1px 2px rgb(16 24 40 / 4%);
      }

      .obwd-summary-card {
        border-left: 3px solid #3155a5;
      }

      .obwd-template-card {
        border-left: 3px solid #7c3aed;
      }

      .obwd-card-body {
        padding: 16px;
      }

      .obwd-card-header {
        padding: 12px 16px;
        border-bottom: 1px solid #e4e7ec;
      }

      .obwd-card-header h2 {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-card-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-card-header-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .obwd-summary-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        flex-wrap: wrap;
      }

      .obwd-eyebrow {
        margin: 0 0 4px;
        font-size: 11px;
        font-weight: 700;
        color: #3155a5;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .obwd-eyebrow-purple {
        color: #6d28d9;
      }

      .obwd-summary-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-summary-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        color: #101828;
      }

      .obwd-muted {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-progress-wrap {
        width: min(320px, 100%);
      }

      .obwd-progress-wrap > span {
        display: block;
        margin-bottom: 5px;
        font-size: 11px;
        font-weight: 600;
        color: #475467;
        text-align: right;
      }

      .obwd-progress-bar {
        height: 6px;
        overflow: hidden;
        border-radius: 4px;
        background: #eaecf0;
      }

      .obwd-progress-bar > span {
        display: block;
        height: 100%;
        background: #3155a5;
        transition: width 0.2s ease;
      }

      .obwd-alert {
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 6px;
        font-size: 13px;
      }

      .obwd-alert-success {
        border: 1px solid #abefc6;
        background: #ecfdf3;
        color: #067647;
      }

      .obwd-alert-danger {
        border: 1px solid #fecdca;
        background: #fef3f2;
        color: #b42318;
      }

      .obwd-badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 12px;
        font-size: 11px;
        font-weight: 600;
        color: #fff;
        white-space: nowrap;
      }

      .obwd-badge-purple {
        background: #7c3aed;
      }

      .obwd-form-grid,
      .obwd-final-summary {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px 16px;
      }

      .obwd-final-summary {
        margin: 16px 0;
        padding: 14px;
        border: 1px solid #d9e2f2;
        border-radius: 7px;
        background: #f8faff;
      }

      .obwd-field label {
        display: block;
        margin-bottom: 4px;
        font-size: 12px;
        font-weight: 500;
        color: #344054;
      }

      .obwd-field input,
      .obwd-field select,
      .obwd-field textarea {
        width: 100%;
        min-height: 34px;
        padding: 6px 10px;
        border: 1px solid #d0d5dd;
        border-radius: 5px;
        font-size: 13px;
      }

      .obwd-field input[readonly],
      .obwd-field textarea[readonly] {
        background: #f7f8fa;
        color: #475467;
      }

      .obwd-field textarea {
        min-height: 96px;
        resize: vertical;
      }

      .obwd-details-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
      }

      .obwd-check-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: #344054;
      }

      .obwd-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-btn {
        min-height: 32px;
        padding: 5px 12px;
        border: 1px solid transparent;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        background: #fff;
      }

      .obwd-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .obwd-btn-primary {
        border-color: #3155a5;
        background: #3155a5;
        color: #fff;
      }

      .obwd-btn-secondary {
        border-color: #d0d5dd;
        color: #344054;
      }

      .obwd-btn-danger {
        border-color: #fda29b;
        color: #b42318;
        background: #fff;
      }

      .obwd-btn-ghost {
        border-color: transparent;
        color: #475467;
        background: transparent;
      }

      .obwd-stage-tabs {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        overflow-x: auto;
        border-bottom: 1px solid #e4e7ec;
        background: #fbfcfd;
      }

      .obwd-stage-tab {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 62px;
        padding: 10px 12px;
        border: 0;
        border-right: 1px solid #eaecf0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: #475467;
        text-align: left;
        cursor: pointer;
      }

      .obwd-stage-tab:last-child {
        border-right: 0;
      }

      .obwd-stage-tab strong,
      .obwd-stage-tab small {
        display: block;
      }

      .obwd-stage-tab strong {
        font-size: 12px;
        font-weight: 600;
        white-space: nowrap;
      }

      .obwd-stage-tab small {
        margin-top: 2px;
        font-size: 10px;
        color: #98a2b3;
      }

      .obwd-stage-tab.is-active {
        border-bottom-color: #3155a5;
        background: #f4f7ff;
        color: #27468d;
      }

      .obwd-stage-tab.is-completed .obwd-stage-icon {
        border-color: #12b76a;
        background: #12b76a;
        color: #fff;
      }

      .obwd-stage-tab.is-rejected .obwd-stage-icon,
      .obwd-stage-tab.is-sent-back .obwd-stage-icon {
        border-color: #f04438;
        background: #fef3f2;
        color: #d92d20;
      }

      .obwd-stage-tab:disabled {
        cursor: not-allowed;
        opacity: 0.64;
      }

      .obwd-stage-icon {
        display: grid;
        flex: 0 0 25px;
        width: 25px;
        height: 25px;
        place-items: center;
        border: 1px solid #98a2b3;
        border-radius: 50%;
        background: #fff;
        font-size: 11px;
      }

      .obwd-stage-body {
        padding: 16px;
      }

      .obwd-stage-heading {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
        flex-wrap: wrap;
      }

      .obwd-stage-heading h3 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-stage-title {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .obwd-lock-copy {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 600;
        color: #667085;
      }

      .obwd-stage-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(300px, 0.85fr);
        gap: 20px;
        align-items: stretch;
      }

      .obwd-stage-main {
        display: flex;
        flex-direction: column;
        min-height: 100%;
      }

      .obwd-stage-fields {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .obwd-remarks {
        display: flex;
        flex: 1;
        flex-direction: column;
        margin-top: 14px;
      }

      .obwd-remarks textarea {
        flex: 1;
        min-height: 120px;
      }

      .obwd-checklist-panel {
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
        border: 1px solid #e4e7ec;
        border-radius: 7px;
        background: #fbfcfd;
      }

      .obwd-checklist-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 14px;
        border-bottom: 1px solid #eaecf0;
      }

      .obwd-checklist-header h4 {
        margin: 0 0 2px;
        font-size: 13px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-checklist-header p {
        margin: 0;
        font-size: 10px;
        color: #667085;
      }

      .obwd-checklist-count {
        padding: 3px 8px;
        border-radius: 10px;
        background: #e9effb;
        font-size: 11px;
        font-weight: 700;
        color: #3155a5;
      }

      .obwd-checklist-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 40px;
        padding: 10px 14px;
        border-bottom: 1px solid #f0f1f3;
        font-size: 12px;
        color: #344054;
      }

      .obwd-checklist-item:last-child {
        border-bottom: 0;
      }

      .obwd-checklist-item input {
        margin-top: 2px;
      }

      .obwd-stage-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-height: 48px;
        margin-top: 16px;
        padding-top: 14px;
        border-top: 1px solid #eaecf0;
        flex-wrap: wrap;
      }

      .obwd-template-card .obwd-card-body {
        padding: 12px 16px;
      }

      .obwd-template-compact-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      .obwd-template-summary {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 13px;
        color: #344054;
      }

      .obwd-template-summary strong {
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-template-chip {
        padding: 2px 8px;
        border-radius: 10px;
        background: #f2f4f7;
        font-size: 11px;
        color: #667085;
      }

      .obwd-template-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px solid #eef0f3;
      }

      .obwd-template-toolbar .obwd-field {
        min-width: 200px;
        margin: 0;
      }

      .obwd-template-toolbar .obwd-field label {
        margin-bottom: 2px;
        font-size: 11px;
      }

      .obwd-template-stages {
        display: grid;
        gap: 6px;
      }

      .obwd-template-stage {
        border: 1px solid #e4e7ec;
        border-radius: 6px;
        background: #fff;
        overflow: hidden;
      }

      .obwd-template-stage.is-disabled {
        opacity: 0.72;
        background: #f9fafb;
      }

      .obwd-template-stage-header {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        background: #fff;
      }

      .obwd-template-stage.is-expanded .obwd-template-stage-header {
        border-bottom: 1px solid #eef0f3;
      }

      .obwd-template-stage-header label {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
        min-width: 0;
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        color: #1d2939;
        cursor: pointer;
      }

      .obwd-template-stage-header label span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .obwd-template-count {
        flex: 0 0 auto;
        font-size: 10px;
        color: #667085;
      }

      .obwd-template-expand {
        flex: 0 0 28px;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 1px solid #e4e7ec;
        border-radius: 5px;
        background: #fff;
        color: #475467;
        cursor: pointer;
      }

      .obwd-template-expand:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .obwd-template-tasks {
        padding: 6px 10px 8px 34px;
        display: grid;
        gap: 4px;
      }

      .obwd-template-task {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 11px;
        color: #475467;
      }

      .obwd-template-task input {
        margin: 0;
      }

      .obwd-modal-backdrop {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgb(16 24 40 / 45%);
      }

      .obwd-modal {
        display: flex;
        flex-direction: column;
        width: min(640px, 100%);
        max-height: min(82vh, 760px);
        overflow: hidden;
        border: 1px solid #e4e7ec;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 16px 40px rgb(16 24 40 / 18%);
      }

      .obwd-modal-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        padding: 16px 18px;
        border-bottom: 1px solid #e4e7ec;
      }

      .obwd-modal-header h2 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 600;
        color: #1d2939;
      }

      .obwd-modal-header p {
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      .obwd-modal-close {
        display: grid;
        width: 32px;
        height: 32px;
        place-items: center;
        padding: 0;
        border: 1px solid #d0d5dd;
        border-radius: 6px;
        background: #fff;
        color: #475467;
        cursor: pointer;
      }

      .obwd-modal-body {
        flex: 1;
        overflow: auto;
        padding: 16px 18px;
      }

      .obwd-modal-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        padding: 12px 18px;
        border-top: 1px solid #e4e7ec;
        background: #fbfcfd;
      }

      .obwd-sticky-footer {
        position: fixed;
        z-index: 20;
        right: 0;
        bottom: 0;
        left: 0;
        min-height: 62px;
        padding: 10px 0;
        border-top: 1px solid #dfe3e8;
        background: rgb(255 255 255 / 96%);
        box-shadow: 0 -4px 12px rgb(16 24 40 / 6%);
        backdrop-filter: blur(8px);
      }

      .obwd-sticky-footer .obwd-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .obwd-sticky-footer p {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        font-size: 12px;
        color: #667085;
      }

      @media (max-width: 1100px) {
        .obwd-stage-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 767px) {
        .obwd-page-header .obwd-container,
        .obwd-summary-top,
        .obwd-details-actions,
        .obwd-sticky-footer .obwd-container,
        .obwd-template-toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .obwd-container {
          padding-left: 12px;
          padding-right: 12px;
        }

        .obwd-page-content {
          padding-top: 12px;
          padding-bottom: 12px;
        }

        .obwd-form-grid,
        .obwd-stage-fields,
        .obwd-final-summary {
          grid-template-columns: 1fr;
        }

        .obwd-role-select {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="obwd-root" id="app"></div>

    <script>
      const EMPLOYEE = {
        id: 'EMP1052',
        name: 'Rohit Kapoor',
        designation: 'Senior Software Engineer',
        manager: 'Vasu Devalla',
        entity: 'Nemo IT Solutions',
        department: 'Engineering',
        resignationDate: '01 May 2026',
        proposedLwd: '31 May 2026',
        approvedLwd: '31 May 2026',
        reason: 'Better career opportunity',
        noticePeriod: '30 days',
      };

      const ROLE_OPTIONS = [
        { value: 'hr', label: 'Priya Sharma · HR Admin' },
        { value: 'manager', label: 'Vasu Devalla · Reporting Manager' },
        { value: 'admin', label: 'Akash Verma · Admin Approver' },
        { value: 'finance', label: 'Neha Gupta · Finance Approver' },
        { value: 'employee', label: 'Rohit Kapoor · Employee' },
      ];

      const CLEARANCE_STAGE_IDS = ['manager', 'admin', 'finance'];

      const TEMPLATE_PRESETS = {
        standard: 'Standard Offboarding',
        minimal: 'Minimal (no Finance)',
      };

      function createDefaultTemplate() {
        return {
          preset: 'standard',
          name: 'Standard Offboarding',
          stages: [
            {
              id: 'resignation',
              label: 'Resignation Approval',
              ownerRole: 'manager',
              defaultAssignee: 'Vasu Devalla',
              enabled: true,
              tasks: [
                {
                  id: 'reason-reviewed',
                  label: 'Resignation reason reviewed',
                  enabled: true,
                },
                {
                  id: 'lwd-reviewed',
                  label: 'Proposed last working date reviewed',
                  enabled: true,
                },
              ],
            },
            {
              id: 'manager',
              label: 'Manager Clearance',
              ownerRole: 'manager',
              defaultAssignee: 'Vasu Devalla',
              enabled: true,
              tasks: [
                { id: 'kt', label: 'Knowledge transfer completed', enabled: true },
                { id: 'tasks', label: 'Pending tasks reassigned', enabled: true },
                { id: 'handover', label: 'Team handover completed', enabled: true },
                {
                  id: 'information',
                  label: 'Company information handed over',
                  enabled: true,
                },
                {
                  id: 'manager-dues',
                  label: 'No manager-level clearance pending',
                  enabled: true,
                },
              ],
            },
            {
              id: 'admin',
              label: 'Admin Clearance',
              ownerRole: 'admin',
              defaultAssignee: 'Akash Verma',
              enabled: true,
              tasks: [
                { id: 'id-card', label: 'ID card returned', enabled: true },
                { id: 'access-card', label: 'Access card returned', enabled: true },
                { id: 'keys', label: 'Office keys returned', enabled: true },
                {
                  id: 'admin-dues',
                  label: 'Administrative dues cleared',
                  enabled: true,
                },
                {
                  id: 'property',
                  label: 'Company property & IT assets returned',
                  enabled: true,
                },
              ],
            },
            {
              id: 'finance',
              label: 'Finance Clearance',
              ownerRole: 'finance',
              defaultAssignee: 'Neha Gupta',
              enabled: true,
              tasks: [
                { id: 'advances', label: 'Salary advances verified', enabled: true },
                {
                  id: 'recoveries',
                  label: 'Loans or recoveries verified',
                  enabled: true,
                },
                {
                  id: 'reimbursements',
                  label: 'Reimbursements cleared',
                  enabled: true,
                },
                {
                  id: 'deductions',
                  label: 'Pending deductions recorded',
                  enabled: true,
                },
                { id: 'finance-dues', label: 'Finance dues cleared', enabled: true },
              ],
            },
            {
              id: 'hr',
              label: 'HR Final Clearance',
              ownerRole: 'hr',
              defaultAssignee: 'Priya Sharma',
              enabled: true,
              tasks: [
                {
                  id: 'exit-interview',
                  label: 'Exit interview completed',
                  enabled: true,
                },
                {
                  id: 'documents',
                  label: 'Required documents collected',
                  enabled: true,
                },
                {
                  id: 'encashment',
                  label: 'Leave encashment reviewed',
                  enabled: true,
                },
                {
                  id: 'clearances',
                  label: 'All mandatory clearances completed',
                  enabled: true,
                },
                {
                  id: 'separation',
                  label: 'Employee ready for separation',
                  enabled: true,
                },
              ],
            },
          ],
        };
      }

      const DEFAULT_RUNTIME = {
        resignation: {
          status: 'Completed',
          completedOn: '03 May 2026',
          remarks:
            'Resignation accepted. Complete the handover plan before release.',
          checklist: { 'reason-reviewed': true, 'lwd-reviewed': true },
        },
        manager: {
          status: 'Completed',
          completedOn: '18 May 2026',
          remarks: 'Knowledge transfer and team handover are complete.',
          checklist: {
            kt: true,
            tasks: true,
            handover: true,
            information: true,
            'manager-dues': true,
          },
        },
        admin: {
          status: 'In Progress',
          completedOn: '—',
          remarks: 'ID card received. Access card and office keys are pending.',
          checklist: {
            'id-card': true,
            'access-card': false,
            keys: false,
            'admin-dues': true,
            property: false,
          },
        },
        finance: {
          status: 'In Progress',
          completedOn: '—',
          remarks:
            'Salary advance verified. Loan recovery and reimbursements pending.',
          checklist: {
            advances: true,
            recoveries: false,
            reimbursements: false,
            deductions: false,
            'finance-dues': false,
          },
        },
        hr: {
          status: 'Pending',
          completedOn: '—',
          remarks: '',
          checklist: {
            'exit-interview': false,
            documents: false,
            encashment: false,
            clearances: false,
            separation: false,
          },
        },
      };

      const BADGE_COLORS = {
        Completed: '#33ba41',
        'In Progress': '#fd7e14',
        'In Clearance': '#fd7e14',
        Pending: '#6b6b6b',
        Locked: '#6b6b6b',
        Rejected: '#e34646',
        'Sent Back': '#e34646',
        'Ready for F&F': '#2e65b6',
      };

      const state = {
        role: 'hr',
        template: createDefaultTemplate(),
        templateModalOpen: false,
        expandedTemplateStageId: null,
        runtime: structuredClone(DEFAULT_RUNTIME),
        selectedStageId: 'admin',
        initiateExit: true,
        readyForFf: false,
        notice: '',
        validation: '',
      };

      function cloneTemplate(template) {
        return structuredClone(template);
      }

      function buildStagesFromTemplate(template, runtime) {
        return template.stages
          .filter((stage) => stage.enabled)
          .map((stageDef) => {
            const saved = runtime[stageDef.id] || {};
            return {
              id: stageDef.id,
              label: stageDef.label,
              ownerRole: stageDef.ownerRole,
              assignee: saved.assignee || stageDef.defaultAssignee,
              status: saved.status || 'Pending',
              completedOn: saved.completedOn || '—',
              remarks: saved.remarks || '',
              checklist: stageDef.tasks
                .filter((task) => task.enabled)
                .map((task) => ({
                  id: task.id,
                  label: task.label,
                  checked: Boolean(saved.checklist?.[task.id]),
                })),
            };
          });
      }

      function syncRuntimeFromStages(stages) {
        stages.forEach((stage) => {
          state.runtime[stage.id] = {
            status: stage.status,
            completedOn: stage.completedOn,
            remarks: stage.remarks,
            assignee: stage.assignee,
            checklist: Object.fromEntries(
              stage.checklist.map((item) => [item.id, item.checked])
            ),
          };
        });
      }

      function getStages() {
        return buildStagesFromTemplate(state.template, state.runtime);
      }

      function applyPreset(preset) {
        const template = createDefaultTemplate();
        template.preset = preset;
        template.name = TEMPLATE_PRESETS[preset];

        if (preset === 'minimal') {
          const finance = template.stages.find((s) => s.id === 'finance');
          if (finance) finance.enabled = false;
        }

        state.template = template;
        state.expandedTemplateStageId = null;
        rebuildEmployeeWorkflow(
          `Loaded ${template.name} template. Employee workflow updated.`
        );
      }

      function rebuildEmployeeWorkflow(noticeMessage) {
        syncRuntimeFromStages(getStages());
        const stages = getStages();
        if (!stages.some((stage) => stage.id === state.selectedStageId)) {
          state.selectedStageId =
            stages.find((stage) => stage.status === 'In Progress')?.id ||
            stages[0]?.id ||
            'resignation';
        }
        if (noticeMessage) state.notice = noticeMessage;
        state.validation = '';
        render();
      }

      function toggleTemplateStage(stageId, enabled) {
        const stage = state.template.stages.find((item) => item.id === stageId);
        if (!stage || stage.id === 'resignation' || stage.id === 'hr') return;
        stage.enabled = enabled;
        if (!enabled && state.expandedTemplateStageId === stageId) {
          state.expandedTemplateStageId = null;
        }
        rebuildEmployeeWorkflow(
          `${stage.label} ${enabled ? 'enabled' : 'removed'} for this employee.`
        );
      }

      function toggleTemplateTask(stageId, taskId, enabled) {
        const stage = state.template.stages.find((item) => item.id === stageId);
        const task = stage?.tasks.find((item) => item.id === taskId);
        if (!task) return;
        task.enabled = enabled;
        rebuildEmployeeWorkflow(
          `Task "${task.label}" ${enabled ? 'added' : 'removed'} from ${stage.label}.`
        );
      }

      function badge(status) {
        const color = BADGE_COLORS[status] || '#6b6b6b';
        return `<span class="obwd-badge" style="background:${color}">${escapeHtml(status)}</span>`;
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function stageIcon(status) {
        if (status === 'Completed') return '✓';
        if (status === 'Locked') return '🔒';
        if (status === 'Rejected' || status === 'Sent Back') return '!';
        return '⏱';
      }

      function getSelectedStage(stages) {
        return stages.find((stage) => stage.id === state.selectedStageId);
      }

      function isResignationApproved(stages) {
        const resignation = stages.find((stage) => stage.id === 'resignation');
        return resignation?.status === 'Completed';
      }

      function getActiveClearanceIds(stages) {
        return CLEARANCE_STAGE_IDS.filter((id) =>
          stages.some((stage) => stage.id === id)
        );
      }

      function areClearancesComplete(stages) {
        const clearanceIds = getActiveClearanceIds(stages);
        return clearanceIds.every((id) => {
          const stage = stages.find((item) => item.id === id);
          return stage?.status === 'Completed';
        });
      }

      function isStageLocked(stage, stages) {
        if (stage.id === 'resignation') return false;
        if (!isResignationApproved(stages)) return true;
        if (stage.id === 'hr') return !areClearancesComplete(stages);
        return false;
      }

      function stageLockMessage(stage, stages) {
        if (!isResignationApproved(stages) && stage.id !== 'resignation') {
          return 'Resignation must be approved before clearance can begin.';
        }
        if (stage.id === 'hr' && !areClearancesComplete(stages)) {
          const pending = getActiveClearanceIds(stages).filter((id) => {
            const item = stages.find((stageItem) => stageItem.id === id);
            return item?.status !== 'Completed';
          });
          const labels = pending
            .map((id) => stages.find((item) => item.id === id)?.label)
            .filter(Boolean);
          return `HR final clearance opens after ${labels.join(', ')} are complete.`;
        }
        return '';
      }

      function getDerived() {
        const stages = getStages();
        const completedCount = stages.filter(
          (stage) => stage.status === 'Completed'
        ).length;
        const allStagesCompleted = stages.every(
          (stage) => stage.status === 'Completed'
        );
        const inProgressStages = stages.filter(
          (stage) => stage.status === 'In Progress'
        );
        const pendingStages = stages.filter(
          (stage) => !['Completed', 'Rejected', 'Sent Back'].includes(stage.status)
        );
        const currentStage =
          inProgressStages.length > 1
            ? {
                label: `${inProgressStages.length} clearances in progress`,
                status: 'In Progress',
              }
            : inProgressStages[0] ||
              pendingStages[0] ||
              stages[stages.length - 1];
        const selectedStage = getSelectedStage(stages);
        const selectedIndex = stages.findIndex(
          (stage) => stage.id === state.selectedStageId
        );
        const stageLocked = selectedStage
          ? isStageLocked(selectedStage, stages)
          : true;
        const canUpdate =
          selectedStage &&
          !stageLocked &&
          selectedStage.status !== 'Completed' &&
          state.role === selectedStage.ownerRole;
        const canAssign =
          state.role === 'hr' &&
          selectedStage &&
          getActiveClearanceIds(stages)
            .concat('resignation', 'manager')
            .includes(selectedStage.id);
        const overallBadgeStatus = state.readyForFf
          ? 'Ready for F&F'
          : stages.some((stage) => stage.status === 'Rejected')
          ? 'Rejected'
          : 'In Clearance';
        const progress = stages.length
          ? Math.round((completedCount / stages.length) * 100)
          : 0;
        const pendingClearances = stages
          .filter(
            (stage) =>
              getActiveClearanceIds(stages).includes(stage.id) &&
              stage.status !== 'Completed'
          )
          .map((stage) => stage.label);

        return {
          stages,
          completedCount,
          allStagesCompleted,
          currentStage,
          selectedStage,
          selectedIndex,
          stageLocked,
          stageLockMessage: selectedStage
            ? stageLockMessage(selectedStage, stages)
            : '',
          canUpdate,
          canAssign,
          overallBadgeStatus,
          progress,
          pendingClearances,
        };
      }

      function getTemplateSummary() {
        const enabledStages = state.template.stages.filter((stage) => stage.enabled);
        const taskCount = enabledStages.reduce(
          (sum, stage) => sum + stage.tasks.filter((task) => task.enabled).length,
          0
        );
        return {
          stageCount: enabledStages.length,
          taskCount,
        };
      }

      function renderField(label, value) {
        return `<div class="obwd-field"><label>${escapeHtml(label)}</label><input readonly value="${escapeHtml(value)}" /></div>`;
      }

      function renderTemplateStageBlocks() {
        return state.template.stages
          .map((stage) => {
            const lockedStage = stage.id === 'resignation' || stage.id === 'hr';
            const enabledTasks = stage.tasks.filter((task) => task.enabled);
            const isExpanded =
              stage.enabled && state.expandedTemplateStageId === stage.id;
            const tasks = stage.tasks
              .map(
                (task) => `<label class="obwd-template-task">
                  <input type="checkbox" ${
                    task.enabled ? 'checked' : ''
                  } onchange="toggleTemplateTask('${stage.id}', '${
                  task.id
                }', this.checked)" />
                  <span>${escapeHtml(task.label)}</span>
                </label>`
              )
              .join('');

            return `<div class="obwd-template-stage ${
              stage.enabled ? '' : 'is-disabled'
            } ${isExpanded ? 'is-expanded' : ''}">
              <div class="obwd-template-stage-header">
                <label>
                  <input type="checkbox" ${
                    stage.enabled ? 'checked' : ''
                  } ${lockedStage ? 'disabled' : ''} onchange="toggleTemplateStage('${
              stage.id
            }', this.checked)" />
                  <span>${escapeHtml(stage.label)}</span>
                </label>
                <span class="obwd-template-count">${
                  stage.enabled
                    ? `${enabledTasks.length}/${stage.tasks.length} tasks`
                    : 'Off'
                }</span>
                <button type="button" class="obwd-template-expand" ${
                  stage.enabled ? '' : 'disabled'
                } aria-label="Toggle tasks" onclick="toggleTemplateStageAccordion('${
              stage.id
            }')">${isExpanded ? '▾' : '▸'}</button>
              </div>
              ${isExpanded ? `<div class="obwd-template-tasks">${tasks}</div>` : ''}
            </div>`;
          })
          .join('');
      }

      function renderTemplateModal() {
        if (!state.templateModalOpen || state.role !== 'hr') return '';

        return `<div class="obwd-modal-backdrop" onclick="closeTemplateModal(event)">
          <div class="obwd-modal" role="dialog" aria-modal="true" aria-labelledby="template-modal-title" onclick="event.stopPropagation()">
            <div class="obwd-modal-header">
              <div>
                <h2 id="template-modal-title">Offboarding template</h2>
                <p>Configure stages and checklist tasks. Changes apply to this employee immediately.</p>
              </div>
              <button type="button" class="obwd-modal-close" aria-label="Close" onclick="closeTemplateModal()">×</button>
            </div>
            <div class="obwd-modal-body">
              <div class="obwd-template-toolbar">
                <div class="obwd-field">
                  <label for="template-preset">Preset</label>
                  <select id="template-preset" onchange="applyPreset(this.value)">
                    ${Object.entries(TEMPLATE_PRESETS)
                      .map(
                        ([key, label]) =>
                          `<option value="${key}" ${
                            state.template.preset === key ? 'selected' : ''
                          }>${escapeHtml(label)}</option>`
                      )
                      .join('')}
                  </select>
                </div>
              </div>
              <div class="obwd-template-stages">${renderTemplateStageBlocks()}</div>
            </div>
            <div class="obwd-modal-footer">
              <button type="button" class="obwd-btn obwd-btn-secondary" onclick="resetTemplate()">Reset</button>
              <button type="button" class="obwd-btn obwd-btn-primary" onclick="closeTemplateModal()">Done</button>
            </div>
          </div>
        </div>`;
      }

      function renderTemplatePanel() {
        if (state.role !== 'hr') return '';

        const summary = getTemplateSummary();

        return `<section class="obwd-card obwd-template-card">
          <div class="obwd-card-body">
            <div class="obwd-template-compact-bar">
              <div class="obwd-template-summary">
                <strong>${escapeHtml(state.template.name)}</strong>
                <span class="obwd-template-chip">${summary.stageCount} stages</span>
                <span class="obwd-template-chip">${summary.taskCount} tasks</span>
              </div>
              <button type="button" class="obwd-btn obwd-btn-secondary" onclick="openTemplateModal()">
                Configure template
              </button>
            </div>
          </div>
        </section>${renderTemplateModal()}`;
      }

      function render() {
        const d = getDerived();
        const stage = d.selectedStage;
        if (!stage) return;

        const checkedCount = stage.checklist.filter((item) => item.checked).length;

        document.getElementById('app').innerHTML = `
          <div class="obwd-prototype-banner">
            <div class="obwd-container">

                      `<option value="${option.value}" ${
                        state.role === option.value ? 'selected' : ''

          <main class="obwd-page-content obwd-container">

            <section class="obwd-card obwd-summary-card">

                    <div class="obwd-summary-title">
                      <h2>${escapeHtml(d.currentStage.label)}</h2>
                      ${badge(state.readyForFf ? 'Ready for F&F' : d.currentStage.status)}
                    </div>
                    <p class="obwd-muted" style="margin-top:4px">
                      Template: ${escapeHtml(state.template.name)} · Parallel clearances ·
                      ${d.completedCount} of ${d.stages.length} stages completed${
          d.pendingClearances.length
            ? ` · Pending: ${escapeHtml(d.pendingClearances.join(', '))}`
            : ''
        }
                    </p>
                  </div>
                  <div class="obwd-progress-wrap">

            ${
              state.notice

                : ''

            <section class="obwd-card">
              <div class="obwd-card-header">
                <div class="obwd-card-header-row">
                  <div>
                    <h2>Employee Details</h2>
                    <p>Resignation request and approved relieving information</p>
                  </div>
                  ${badge(d.overallBadgeStatus)}
                </div>
              </div>
              <div class="obwd-card-body">
                <div class="obwd-form-grid">
                  ${renderField('Employee ID', EMPLOYEE.id)}
                  ${renderField('Employee name', EMPLOYEE.name)}
                  ${renderField('Designation', EMPLOYEE.designation)}
                  ${renderField('Reporting manager', EMPLOYEE.manager)}
                  ${renderField('Legal entity', EMPLOYEE.entity)}
                  ${renderField('Department', EMPLOYEE.department)}
                  ${renderField('Resignation date', EMPLOYEE.resignationDate)}
                  ${renderField('Proposed last working date', EMPLOYEE.proposedLwd)}
                  ${renderField('Approved relieving date', EMPLOYEE.approvedLwd)}
                  ${renderField('Notice period', EMPLOYEE.noticePeriod)}
                  ${renderField('Resignation reason', EMPLOYEE.reason)}
                </div>
                <div class="obwd-details-actions">
                  <label class="obwd-check-row">
                    <input type="checkbox" ${
                      state.initiateExit ? 'checked' : ''

                    Initiate Exit Process

                  <div class="obwd-actions">
                    ${

              </div>
              <div class="obwd-stage-tabs" role="tablist" aria-label="Workflow stages">
                ${d.stages
                  .map((item) => {
                    const statusClass = item.status.toLowerCase().replace(/ /g, '-');
                    const locked = isStageLocked(item, d.stages);
                    const iconStatus = locked ? 'Locked' : item.status;
                    const disabled = locked && state.role !== 'hr';
                    return `<button type="button" role="tab" class="obwd-stage-tab is-${statusClass} ${
                      state.selectedStageId === item.id ? 'is-active' : ''
                    }" ${disabled ? 'disabled' : ''} onclick="selectStage('${item.id}')">
                      <span class="obwd-stage-icon">${stageIcon(iconStatus)}</span>
                      <span><strong>${escapeHtml(item.label)}</strong><small>${escapeHtml(
                      locked && item.status !== 'Completed' ? 'Locked' : item.status
                    )}</small></span>
                    </button>`;
                  })
                  .join('')}
              </div>
              <div class="obwd-stage-body">
                <div class="obwd-stage-heading">
                  <div>
                    <div class="obwd-stage-title">
                      <h3>${escapeHtml(stage.label)}</h3>
                      ${badge(stage.status)}

                    <p class="obwd-muted" style="margin-top:4px">Each department works independently. Only the assigned approver can update their stage. HR can view every stage.</p>
                  </div>
                  ${
                    d.stageLockMessage
                      ? `<span class="obwd-lock-copy">🔒 ${escapeHtml(d.stageLockMessage)}</span>`
                      : ''
                  }
                </div>

                <div class="obwd-stage-grid">
                  <div class="obwd-stage-main">
                    <div class="obwd-form-grid obwd-stage-fields">
                      <div class="obwd-field">
                        <label>Assigned approver / department</label>
                        ${
                          d.canAssign
                            ? `<select onchange="setAssignee(this.value)">
                                <option ${stage.assignee === 'Vasu Devalla' ? 'selected' : ''}>Vasu Devalla</option>

                                <option ${stage.assignee === 'Finance Department' ? 'selected' : ''}>Finance Department</option>

                            : `<input readonly value="${escapeHtml(stage.assignee)}" />`

                      </div>
                      ${

                          ? `${renderField('Reporting manager', EMPLOYEE.manager)}
                             ${renderField('Proposed last working date', EMPLOYEE.proposedLwd)}
                             ${renderField('Resignation reason', EMPLOYEE.reason)}`
                          : ''
                      }
                    </div>

                    ${
                      stage.id === 'hr'
                        ? `<div class="obwd-final-summary obwd-form-grid">
                            ${renderField('All required approvals', `${d.completedCount} of ${d.stages.length} completed`)}
                            ${renderField('Leave balance', '12 days')}
                            ${renderField('Approved leave encashment', '8 days')}
                            ${renderField('Asset clearance summary', '2 returned · 1 pending')}
                            ${renderField('Approved last working date', EMPLOYEE.approvedLwd)}
                            ${renderField('Separation reason', 'Voluntary resignation')}
                            ${renderField('Ready for F&F status', state.readyForFf ? 'Ready for F&F' : 'Not ready')}
                          </div>`
                        : ''
                    }

                      <label>Remarks</label>
                      <textarea rows="4" ${
                        d.canUpdate ? '' : 'readonly'
                      } placeholder="${
          d.canUpdate
            ? 'Add remarks. Required for Reject and Send Back.'
            : 'No remarks added.'
        }" oninput="setRemarks(this.value)">${escapeHtml(stage.remarks)}</textarea>
                    </div>
                  </div>

                  <div class="obwd-checklist-panel">
                    <div class="obwd-checklist-header">
                      <div>
                        <h4>Mandatory checklist</h4>
                        <p>All items must be complete before approval.</p>
                      </div>
                      <span class="obwd-checklist-count">${checkedCount}/${stage.checklist.length}</span>
                    </div>
                    <div>
                      ${
                        stage.checklist.length
                          ? stage.checklist
                              .map(
                                (item) => `<label class="obwd-checklist-item">
                                  <input type="checkbox" ${item.checked ? 'checked' : ''} ${
                                  d.canUpdate ? '' : 'disabled'
                                } onchange="toggleChecklist('${item.id}', this.checked)" />
                                  <span>${escapeHtml(item.label)}</span>
                                </label>`
                              )
                              .join('')
                          : '<p class="obwd-muted" style="padding:12px 14px">No tasks configured for this stage.</p>'
                      }
                    </div>
                  </div>
                </div>

                ${
                  state.validation
                    ? `<div class="obwd-alert obwd-alert-danger" style="margin-top:16px">${escapeHtml(
                        state.validation
                      )}</div>`
                    : ''
                }

                <div class="obwd-stage-actions">
                  ${
                    d.canUpdate
                      ? `<button type="button" class="obwd-btn obwd-btn-danger" onclick="performDecision('Rejected')">Reject</button>
                         <button type="button" class="obwd-btn obwd-btn-secondary" onclick="performDecision('Sent Back')">↺ Send Back</button>
                         <button type="button" class="obwd-btn obwd-btn-secondary" onclick="save()">Save</button>
                         <button type="button" class="obwd-btn obwd-btn-primary" onclick="performDecision('Completed')">✓ Approve</button>`
                      : `<p class="obwd-muted">${
                          stage.status === 'Completed'
                            ? `Completed by ${escapeHtml(stage.assignee)} on ${escapeHtml(stage.completedOn)}.`
                            : d.stageLockMessage
                            ? escapeHtml(d.stageLockMessage)
                            : `Switch to the ${escapeHtml(stage.ownerRole)} role to update this stage.`
                        }</p>`
                  }
                </div>
              </div>
            </section>
          </main>

          <footer class="obwd-sticky-footer">
            <div class="obwd-container">
              <p>🛡 Final F&amp;F processing remains in greytHR.</p>
              <div class="obwd-actions">
                <button type="button" class="obwd-btn obwd-btn-secondary" onclick="resetScenario()">Cancel</button>
                <button type="button" class="obwd-btn obwd-btn-secondary" onclick="save()">Save</button>
                <button type="button" class="obwd-btn obwd-btn-primary" ${
                  !d.allStagesCompleted || state.role !== 'hr' || state.readyForFf
                    ? 'disabled'
                    : ''
                } title="${
          state.role !== 'hr' ? 'Only HR can complete the F&F handoff' : ''
        }" onclick="moveToFf()">
                  ${state.readyForFf ? 'Ready for F&F' : 'Move to Ready for F&F'}
                </button>
              </div>
            </div>
          </footer>
        `;
      }

      window.setRole = function (role) {
        state.role = role;
        render();
      };

      window.openTemplateModal = function () {
        state.templateModalOpen = true;
        render();
      };

      window.closeTemplateModal = function (event) {
        if (event && event.target !== event.currentTarget) return;
        state.templateModalOpen = false;
        state.expandedTemplateStageId = null;
        render();
      };

      window.toggleTemplateStageAccordion = function (stageId) {
        state.expandedTemplateStageId =
          state.expandedTemplateStageId === stageId ? null : stageId;
        render();
      };

      window.resetTemplate = function () {
        state.template = createDefaultTemplate();
        state.expandedTemplateStageId = null;
        rebuildEmployeeWorkflow('Template reset to Standard Offboarding.');
      };

      window.selectStage = function (id) {
        const stages = getStages();
        const stage = stages.find((item) => item.id === id);
        if (stage && isStageLocked(stage, stages) && state.role !== 'hr') return;
        state.selectedStageId = id;
        state.validation = '';
        render();
      };

      window.setInitiateExit = function (checked) {
        state.initiateExit = checked;
      };

      window.setAssignee = function (assignee) {
        const stages = getStages();
        const stage = stages.find((item) => item.id === state.selectedStageId);
        if (stage) {
          state.runtime[stage.id] = state.runtime[stage.id] || {};
          state.runtime[stage.id].assignee = assignee;
        }
        render();
      };

      window.setRemarks = function (remarks) {
        const stage = getSelectedStage(getStages());
        if (stage) {
          state.runtime[stage.id] = state.runtime[stage.id] || {};
          state.runtime[stage.id].remarks = remarks;
          state.validation = '';
        }
      };

      window.toggleChecklist = function (checkId, checked) {
        const stage = getSelectedStage(getStages());
        if (!stage) return;
        state.runtime[stage.id] = state.runtime[stage.id] || { checklist: {} };
        state.runtime[stage.id].checklist = state.runtime[stage.id].checklist || {};
        state.runtime[stage.id].checklist[checkId] = checked;
        state.notice = '';
        render();
      };

      window.performDecision = function (decision) {
        const d = getDerived();
        const stage = d.selectedStage;
        if (!stage) return;

        if (['Rejected', 'Sent Back'].includes(decision) && !stage.remarks.trim()) {
          state.validation = `Remarks are required when a stage is ${decision.toLowerCase()}.`;
          render();
          return;
        }
        if (
          decision === 'Completed' &&
          stage.checklist.some((item) => !item.checked)
        ) {
          state.validation =
            'Complete every mandatory checklist item before approving this stage.';
          render();
          return;
        }

        state.runtime[stage.id] = state.runtime[stage.id] || {};
        state.runtime[stage.id].status = decision;
        state.runtime[stage.id].completedOn =
          decision === 'Completed' ? '01 Sep 2026' : '—';

        if (decision === 'Completed' && stage.id === 'resignation') {
          getActiveClearanceIds(d.stages).forEach((id) => {
            if (state.runtime[id]?.status === 'Pending') {
              state.runtime[id].status = 'In Progress';
            }
          });
        }

        if (decision === 'Completed') {
          const stagesAfter = getStages();
          if (stage.id !== 'hr' && areClearancesComplete(stagesAfter)) {
            if (state.runtime.hr?.status === 'Pending') {
              state.runtime.hr.status = 'In Progress';
            }
          }
        }

        state.validation = '';
        if (decision === 'Completed') {
          if (stage.id === 'resignation') {
            state.notice =
              'Resignation approved. Enabled department clearances can now run in parallel.';
          } else if (stage.id === 'hr') {
            state.notice =
              'HR final clearance approved. All stages are complete — ready for F&F handoff.';
          } else {
            const remaining = getActiveClearanceIds(getStages()).filter((id) => {
              const item = state.runtime[id];
              return item?.status !== 'Completed';
            });
            state.notice =
              remaining.length > 0
                ? `${stage.label} approved. ${remaining.length} clearance stage(s) still pending.`
                : `${stage.label} approved. HR final clearance is now available.`;
          }
        } else {
          state.notice = `${stage.label} marked ${decision}. Review and update as needed.`;
        }
        render();
      };

      window.save = function () {
        state.notice = 'Prototype changes saved for this resignation record.';
        render();
      };

      window.resetScenario = function () {
        state.template = createDefaultTemplate();
        state.templateModalOpen = false;
        state.expandedTemplateStageId = null;
        state.runtime = structuredClone(DEFAULT_RUNTIME);
        state.selectedStageId = 'admin';
        state.initiateExit = true;
        state.readyForFf = false;
        state.validation = '';
        state.notice =
          'Unsaved changes cancelled. Template and employee workflow restored.';
        render();
      };

      window.moveToFf = function () {
        const d = getDerived();
        if (!d.allStagesCompleted || state.role !== 'hr') return;
        state.readyForFf = true;
        state.notice =
          'Employee moved to Ready for F&F. Final processing continues in greytHR.';
        render();
      };

      render();
    </script>
  </body>
</html>
